name: Build and deploy jw-api to Azure App Service

on:
  push:
    branches:
      - azure-stable
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4.2.2

      - name: ✅ Install pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: ✅ Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: ✅ Install dependencies
        run: pnpm install

      - name: ✅ Build Nuxt app
        run: pnpm build
        env:
          NODE_ENV: production

      - name: ✅ Zip build output
        run: |
          cd .output
          zip -r ../release.zip .
          cd ..

      - name: ✅ Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: jw-api-build
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: ✅ Download artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: jw-api-build

      - name: 🔍 Debug OIDC token subject
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | \
            jq -r '.value')
          echo "OIDC Token payload:"
          echo $OIDC_TOKEN | cut -d'.' -f2 | base64 -d 2>/dev/null | jq .sub

      - name: ✅ Login to Azure
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ✅ Deploy to Azure App Service
        uses: azure/webapps-deploy@v3.0.2
        with:
          app-name: 'softnado-jw-api'
          slot-name: 'Production'
          package: release.zip

      - name: ✅ Logout of Azure
        run: az logout
        if: always()
