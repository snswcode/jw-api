name: Build and deploy jw-api to Azure App Service

on:
  push:
    branches:
      - azure-stable
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: ✅ Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: ✅ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: ✅ Install dependencies
        run: pnpm install

      - name: ✅ Build Nuxt app
        run: pnpm build
        env:
          NODE_ENV: production

      - name: ✅ Zip build output
        run: |
          cd .output
          zip -r ../release.zip .
          cd ..

      - name: ✅ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jw-api-build
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: none

    steps:
      - name: ✅ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jw-api-build

      - name: ✅ Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'softnado-jw-api'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: release.zip